[project]
name = "arcadia-recommendation-service"
version = "0.1.0"
description = "Arcadia Recommendation Service — hybrid content-based and collaborative game recommendations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp-proto-http",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    # The Go services (wallet, payment, marketplace) produce with snappy, and
    # without the codec a consumer raises UnsupportedCodecError on the first
    # message and its loop dies — silently, from the caller's point of view. lz4
    # and zstd are included so a future producer choosing either cannot break
    # this service the same way.
    "aiokafka[snappy,lz4,zstd]>=0.12",
    "redis>=5",
    "pyjwt>=2.9",
    "prometheus-client>=0.21,<1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcadia_recommendation"]

[tool.ruff]
src = ["src"]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TID", "ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"src/arcadia_recommendation/domain/shared/errors.py" = ["N818"]
"src/arcadia_recommendation/application/errors.py" = ["N818"]
"src/arcadia_recommendation/infrastructure/messaging/serialization.py" = ["ANN401"]
"src/arcadia_recommendation/infrastructure/observability/logging.py" = ["ANN401"]
"src/arcadia_recommendation/infrastructure/persistence/memory/unit_of_work.py" = ["ANN401"]
"src/arcadia_recommendation/infrastructure/response_cache.py" = ["ANN401"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["arcadia_recommendation"]

[[tool.mypy.overrides]]
# aiokafka ships no py.typed marker. Silencing the import is narrower than loosening strictness for the
# modules that use it, which is where the real type checking matters.
module = ["aiokafka.*"]
ignore_missing_imports = true
