# Migrations live inside the package so the installed wheel carries them; this file is only the entry point
# for running them by hand (`just migrate`). The URL is left empty on purpose — env.py reads DATABASE_URL
# through Settings, so there is one place a connection string comes from rather than two that can disagree.
[alembic]
script_location = src/arcadia_recommendation/infrastructure/persistence/sql/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
